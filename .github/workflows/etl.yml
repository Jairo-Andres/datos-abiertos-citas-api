name: ETL semanal

on:
  schedule:
    - cron: "0 11 * * 1"  # lunes 6:00 a. m. hora de Colombia
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar, transformar y cargar en Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m etl.run --csv data/oportunidad_unificada.csv
      - uses: actions/upload-artifact@v4
        with:
          name: oportunidad-unificada
          path: data/oportunidad_unificada.csv
